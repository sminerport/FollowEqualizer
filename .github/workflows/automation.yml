name: FollowEqualizer Automation

# Scheduled runs only FOLLOW BACK. Unfollowing is destructive, so it only runs
# when you ask for it: trigger the workflow manually and tick the box, or set a
# repository variable SCHEDULE_UNFOLLOW=true to include it in scheduled runs.
# Exceptions come from exclude_list.json at the repo root (commit it!).
#
# `main` is the gate: the job checks out `main`, so code and exclude_list.json
# changes go live only after a dev -> main promotion. GitHub still reads this
# workflow FILE from the default branch (dev), so edits to the YAML itself take
# effect as soon as they land on dev. A manual run can target another ref
# (e.g. `dev`) to dry-run unpromoted code.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to run (default main; use dev to test unpromoted code)
        type: string
        default: main
      follow_back:
        description: Follow back users who follow you
        type: boolean
        default: true
      unfollow_nonfollowers:
        description: Unfollow users who do not follow you back (destructive)
        type: boolean
        default: false
      dry_run:
        description: Only report what would change, make no changes
        type: boolean
        default: false
  schedule:
    - cron: '0 9 * * *'  # daily at 09:00 UTC

permissions:
  contents: read
  actions: write  # lets the keepalive step re-enable this workflow

concurrency:
  group: follow-equalizer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || 'main' }}   # scheduled runs have no inputs -> main

      - name: Show what is running
        env:
          REQUESTED_REF: ${{ inputs.ref || 'main' }}   # checkout leaves a detached HEAD
        run: echo "requested ref=$REQUESTED_REF commit=$(git rev-parse --short HEAD)"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run FollowEqualizer
        env:
          GITHUB_TOKEN: ${{ secrets.FOLLOW_EQUALIZER_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FOLLOW_BACK: ${{ inputs.follow_back }}
          INPUT_UNFOLLOW: ${{ inputs.unfollow_nonfollowers }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          SCHEDULE_UNFOLLOW: ${{ vars.SCHEDULE_UNFOLLOW }}
        run: |
          set -euo pipefail
          args=()
          if [ "$EVENT_NAME" = "schedule" ]; then
            args+=(--follow-back)
            if [ "${SCHEDULE_UNFOLLOW:-false}" = "true" ]; then
              args+=(--unfollow-nonfollowers)
            fi
          else
            if [ "$INPUT_FOLLOW_BACK" = "true" ]; then
              args+=(--follow-back)
            fi
            if [ "$INPUT_UNFOLLOW" = "true" ]; then
              args+=(--unfollow-nonfollowers)
            fi
            if [ "$INPUT_DRY_RUN" = "true" ]; then
              args+=(--dry-run)
            fi
          fi
          echo "Running: python src/automation.py ${args[*]}"
          python src/automation.py "${args[@]}"

      # GitHub disables cron workflows after 60 days without commits. Calling the
      # "enable workflow" endpoint on every run resets that clock.
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/automation.yml/enable"
